[project]
name = "steamanalysis-backend"
version = "0.1.0"
description = "FastAPI backend for the SteamAnalysis public game data agent."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.17.2",
  "apscheduler>=3.11.1",
  "fastapi>=0.136.1",
  "httpx>=0.28.1",
  "langchain>=1.0.8",
  "langchain-deepseek>=0.1.4",
  "pydantic>=2.12.4",
  "pydantic-settings>=2.12.0",
  "python-dotenv>=1.2.1",
  "sqlite-vec>=0.1.9",
  "sqlmodel>=0.0.27",
  "tenacity>=9.1.2",
  "uvicorn[standard]>=0.38.0"
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.1",
  "pytest-asyncio>=1.3.0",
  "ruff>=0.15",
  "mypy>=1.14"
]
openai = [
  "langchain-openai>=0.3.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends in function signature is the standard pattern

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["alembic/", ".venv/"]
