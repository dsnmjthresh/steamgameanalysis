interview_talking_points:
  - topic: "为什么自建状态机而不用LangGraph"
    answer: "9种任务模式可枚举，确定性状态机比图编排更透明；AgentRun/AgentCheckpoint双表持久化让每次运行有完整审计链——这在LangGraph里需要额外实现；反思循环的触发条件在代码中直接表达比LangGraph条件边更直观。"
    code_ref: "runtime.py:55-67, 173-180"

  - topic: "为什么RRF融合而不是纯向量检索"
    answer: "默认embedding在没配API Key时退化到BLAKE2b hash（无语义），纯向量检索不可靠。RRF让FTS5关键词（精确匹配'CS2'/'appid 730'）和向量语义互补；关键词权重1.2 > 向量1.0 因精确匹配在实际查询中更可靠。整条链有4层fallback。"
    code_ref: "knowledge_service.py:543-554"

  - topic: "工具调用失败怎么处理"
    answer: "三层容错：① 错误分类→匹配的才重试（timeout/rate_limit重试，permission_denied不重试）；② 指数退避（delay×2^attempt）；③ 全部失败后抛给状态机层，状态机try/catch每个状态转换，失败后写入错误checkpoint并构建带error信息的result返回用户，不会整个服务崩溃。"
    code_ref: "tools.py:372-403, runtime.py:342-364"

  - topic: "RAG从62.5%提升到100%做了什么"
    answer: "初始12条种子文档覆盖范围窄（仅CS2/Dota2/黑神话/Elden Ring各3篇），6条查询完全没有对应内容。从12条扩充到25条：补了CS2英文ranking guide、Dota 2英文patch notes、Dota 2比赛meta中英文、Elden Ring DLC中英文、CS2职业设置/英文config。每个未命中case补1-2条精准文档后Recall直接拉满。这验证了检索算法本身没问题，瓶颈在文档覆盖度。"
    code_ref: "test_rag_eval.py:65-90"
